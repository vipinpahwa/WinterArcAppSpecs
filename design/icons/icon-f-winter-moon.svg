<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Layer 1: background — deep indigo night -->
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1238"/>
      <stop offset="1" stop-color="#1E2F7A"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="440" r="250" fill="#fff"/>
      <circle cx="600" cy="380" r="215" fill="#000"/>
    </mask>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bgF)"/>
  <!-- Layer 2: horizon arc (ice) -->
  <path id="horizon" d="M -40 900 A 700 700 0 0 1 1064 900 L 1064 1024 L -40 1024 Z" fill="#6FA0FF" opacity="0.9"/>
  <!-- Layer 3: crescent moon (white), single shape -->
  <rect id="moon" width="1024" height="1024" fill="#FFFFFF" mask="url(#crescent)"/>
  <!-- Layer 4: three snow dots -->
  <circle cx="230" cy="250" r="22" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="800" cy="300" r="16" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="720" cy="640" r="20" fill="#FFFFFF" opacity="0.8"/>
</svg>
